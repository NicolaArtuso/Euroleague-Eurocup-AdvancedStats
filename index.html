<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Euroleague Advanced Stats</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div>
    <div class="logo">EuroLeague // Advanced Stats</div>
    <div class="subtitle">play-by-play &rarr; advanced metrics</div>
  </div>
  <button class="back-btn" id="backBtn">&larr; back to schedule</button>
</header>

<div class="controls">
  <div class="field">
    <label>Competition</label>
    <select id="league">
      <option value="E">EuroLeague</option>
      <option value="U">EuroCup</option>
    </select>
  </div>
  <div class="field">
    <label>Season</label>
    <input type="number" id="season" value="2024" min="2000" max="2030" />
  </div>
  <button class="primary" id="btnLoad">Load schedule</button>
</div>

<div id="status">Loading schedule&hellip;</div>

<div class="cors-notice" id="corsNotice">
  <strong>&#9888; CORS / network error</strong>
  The Euroleague API blocked this request from the browser. This can happen on some networks;
  try again, or check that the season code is correct.
</div>

<!-- Landing view: schedule of games -->
<div id="landing">
  <div id="roundControls" class="round-controls hidden">
    <button class="ghost-btn" onclick="setAllRounds(true)">expand all</button>
    <button class="ghost-btn" onclick="setAllRounds(false)">collapse all</button>
  </div>
  <div id="scheduleContainer"></div>
</div>

<!-- Detail view: single game advanced stats -->
<div id="detail" class="hidden">
  <div id="scoreboard"></div>
  <main>
    <div id="detailContent"></div>
  </main>
</div>

<script src="script.js"></script>
</body>
</html>
